# Keeps the free-tier Supabase project from auto-pausing after 7 days of
# inactivity by running a tiny real database query every 3 days.
#
# Requires repo secrets SUPABASE_URL and SUPABASE_ANON_KEY (the same public
# values as js/supabaseClient.js).
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *" # every 3 days at 09:17 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query the questions table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/questions?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $status"
          test "$status" = "200"
